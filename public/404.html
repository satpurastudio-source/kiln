<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — kiln</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0c08" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* the landing's palette (welcome/index.html), for anyone who lands on a
         mistyped link — e.g. /welcom from the Instagram ad */
      :root {
        --bg: #f5f1e8;
        --ink: #201c13;
        --ink-soft: rgba(32, 28, 19, 0.62);
        --line: rgba(32, 28, 19, 0.16);
        --clay: #d85a30;
        --g1: #e6dec6;
        --g2: #cfc7aa;
        --g3: #a9a284;
        --g4: #6e6951;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0c08;
          --ink: #f3ecdc;
          --ink-soft: rgba(243, 236, 220, 0.62);
          --line: rgba(243, 236, 220, 0.16);
          --g1: #2a2519;
          --g2: #1e1b12;
          --g3: #15130c;
          --g4: #0d0c08;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Figtree', sans-serif;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        width: min(640px, 100%);
        margin: 0 auto;
        padding: 64px 22px 32px;
      }
      .mark { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 700 1.3rem 'Fraunces', serif; }
      .mark img { width: 30px; height: 30px; }
      .mark span { color: var(--clay); }
      h1 {
        font: 700 clamp(2.6rem, 11vw, 4.6rem) / 0.98 'Fraunces', serif;
        letter-spacing: -0.02em;
      }
      h1 em { font-weight: 500; color: var(--clay); }
      p { font-size: 1.1rem; line-height: 1.55; color: var(--ink-soft); max-width: 30em; }
      .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
      .btn {
        display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px;
        border-radius: 99px; background: var(--clay); color: #fff8ee;
        font-weight: 700; font-size: 1.02rem; text-decoration: none;
      }
      .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
      .btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
      svg { display: block; width: 100%; height: 120px; }
      .g1 { fill: var(--g1); } .g2 { fill: var(--g2); } .g3 { fill: var(--g3); } .g4 { fill: var(--g4); }
    </style>
  </head>
  <body>
    <main>
      <a class="mark" href="/welcome/"><img src="/icons/icon.svg" alt="" />kiln<span>.</span></a>
      <h1>This page<br /><em>isn't here.</em></h1>
      <p>The link may have a typo, or the page has moved. kiln itself is one tap away.</p>
      <div class="cta">
        <a class="btn" href="/welcome/">See kiln →</a>
        <a class="btn ghost" href="/">Open the app</a>
      </div>
    </main>
    <svg viewBox="0 0 1440 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path class="g1" d="M0,70 Q120,40 250,60 T520,48 Q650,22 780,44 T1040,34 Q1180,12 1300,36 L1440,26 V260 H0 Z" />
      <path class="g2" d="M0,120 Q140,88 280,112 T560,98 Q700,70 840,96 T1120,84 Q1260,62 1440,88 V260 H0 Z" />
      <path class="g3" d="M0,172 Q160,140 320,164 T640,150 Q800,124 960,154 T1260,142 Q1350,132 1440,146 V260 H0 Z" />
      <path class="g4" d="M0,220 Q180,192 360,214 T720,204 Q900,180 1080,208 T1440,198 V260 H0 Z" />
    </svg>
  </body>
</html>
